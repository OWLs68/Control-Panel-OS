# Checks every push, including the Roma OS branch. Deliberately separate from
# deploy.yml: this must run on a feature branch without anything reaching the
# published site.
name: CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Guard the Hermes boundary
        run: node scripts/check-gateway-boundary.mjs

  # The Roma gateway is its own package (server/roma-gateway): a Node service
  # that never ships to Pages, checked here with its own lint, types and tests.
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Gateway — lint, types, tests
        run: npm run verify --workspace server/roma-gateway

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # WebKit is the engine iOS actually ships, so CI runs it even though the
      # cloud dev session cannot download it.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end (iPhone viewport, Chromium + WebKit)
        env:
          PW_WEBKIT: '1'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
