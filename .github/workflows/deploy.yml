# Deploys to GitHub Pages from main.
#
# The app is a static PWA, so Pages is enough — no backend, no secrets. Every
# asset is referenced relatively ('./bundle.js'), so the build needs no base
# path and works at any sub-path the site is served from.
name: Deploy to GitHub Pages

# main only. The Roma OS branch must NOT publish: the live URL still serves the
# old Control Panel, and switching it over is a separate, deliberate decision.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than dropping a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A broken build must never reach the published URL.
      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # Smoke-tests the PUBLISHED site, not a local build: the base path, the
  # service-worker scope and the manifest are exactly the things that only break
  # once the app is served from its real URL.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Smoke test the deployed site
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-deploy.mjs
