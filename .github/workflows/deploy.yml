# Deploys the Control Panel to GitHub Pages.
#
# The app is a static PWA, so Pages is enough — no backend, no secrets.
# Two details this build depends on:
#   * DEPLOY_BASE must be the ABSOLUTE sub-path of the project site. The router
#     takes its basename from BASE_URL, and a relative base ('./') normalises to
#     '/./' and matches nothing.
#   * The build emits 404.html (a copy of index.html) so a hard refresh on a
#     deep link still renders, since Pages has no SPA fallback.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gallant-ride-l1zixz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than dropping a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A broken build must never reach the published URL.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build
        # `base_path` is what Pages reports for this site, e.g. /Control-Panel-OS
        env:
          DEPLOY_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
